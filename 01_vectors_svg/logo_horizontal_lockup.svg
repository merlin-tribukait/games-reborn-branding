      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8f96a3"/>
    </linearGradient>
    <linearGradient id="h-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="#08080c"/>
  
  <!-- Crest Icon Mini -->
  <g transform="translate(40, 30) scale(0.3)">
