  <text x="325" y="195" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="20" fill="#ff2d55" letter-spacing="5">NEXT-GEN MULTI-REALM GAMING PLATFORM</text>
  <line x1="325" y1="225" x2="1050" y2="225" stroke="url(#h-neon)" stroke-width="2"/>
</svg>