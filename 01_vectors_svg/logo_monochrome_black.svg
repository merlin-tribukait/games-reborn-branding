<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2d55" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#08080c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#8f96a3"/>
      <stop offset="100%" stop-color="#2a2d36"/>
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Glow -->
  <rect width="800" height="800" fill="none"/>
  <circle cx="400" cy="400" r="350" fill="url(#bg-glow)"/>

  <!-- Outer Armored Shield -->
  <polygon points="400,90 650,180 620,530 400,710 180,530 150,180" 
           fill="none" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
           
  <!-- Neon Energy Channel -->
  <polygon points="400,125 615,205 590,505 400,665 210,505 185,205" 
           fill="none" stroke="#000000" stroke-width="4" filter="url(#glow-filter)"/>

  <!-- Inner Carbon Chassis -->
  <polygon points="400,150 580,225 560,480 400,620 240,480 220,225" 
           fill="#0c0d14" stroke="#252733" stroke-width="3"/>

  <!-- Center Core Monogram / Emblem -->
  
  <!-- GR Phoenix Centerpiece -->
  <g transform="translate(230, 240) scale(1.7)" filter="url(#glow-filter)">
    <path d="M 30,100 C 50,40 100,20 100,20 C 100,20 150,40 170,100 C 140,85 115,95 100,115 C 85,95 60,85 30,100 Z" fill="url(#neon-glow)"/>
    <path d="M 35,60 L 85,60 L 85,85 L 60,85 L 60,135 L 85,135 L 85,110 L 70,110 L 70,95 L 100,95 L 100,155 L 35,155 Z" fill="url(#shield-rim)" stroke="{accent_primary}" stroke-width="2"/>
    <path d="M 115,60 L 165,60 L 165,110 L 145,110 L 165,155 L 135,155 L 120,115 L 115,115 L 115,155 L 95,155 L 95,60 Z M 115,75 L 115,95 L 145,95 L 145,75 Z" fill="url(#shield-rim)" stroke="{accent_secondary}" stroke-width="2"/>
  </g>
  

  <!-- Bottom Brand Text -->
  <text x="400" y="745" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="4">GAMES REBORN</text>
  <text x="400" y="775" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ff2d55" letter-spacing="3">NEXT-GEN MULTI-REALM GAMING PLATFORM</text>
</svg>